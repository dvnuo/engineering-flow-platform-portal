{% from "partials/connectors/_macros.html" import setup_guide with context %}
<section class="portal-panel-section" id="profile-section-proxy" data-managed-section="proxy">
      {{ setup_guide('proxy') }}
      <div class="portal-checkbox-row">
          <label class="toggle-switch" aria-label="Enable Proxy">
              <input type="checkbox" name="proxy_enabled" {% if proxy.get('enabled') %}checked{% endif %} />
              <span class="toggle-slider"></span>
          </label>
          <span>Enabled</span>
      </div>
      <label class="portal-form-label"><span class="portal-form-label">Proxy URL</span><input type="text" name="proxy_url" value="{{ proxy.get('url', '') }}" placeholder="http://proxy.example.com:8080" class="portal-form-input" /></label>
      <div class="grid grid-cols-2 gap-3"><label class="portal-form-label"><span class="portal-form-label">Username</span><input type="text" name="proxy_username" value="{{ proxy.get('username', '') }}" placeholder="Optional" class="portal-form-input" /></label><label class="portal-form-label"><span class="portal-form-label">Password</span><input type="password" name="proxy_password" value="{{ proxy.get('password', '') }}" placeholder="Optional" class="portal-form-input" /></label></div>
      <div class="flex items-center gap-2"><button type="button" class="portal-btn is-secondary" data-test-target="proxy">Test Proxy</button><div class="portal-inline-state" data-test-result="proxy"></div></div>
    </section>
