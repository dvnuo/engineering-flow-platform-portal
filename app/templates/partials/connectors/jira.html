{% from "partials/connectors/_macros.html" import setup_guide with context %}
<section class="portal-panel-section" data-instance-group="jira" id="profile-section-jira" data-managed-section="jira">
      {{ setup_guide('jira') }}
      <div class="portal-checkbox-row">
          <label class="toggle-switch" aria-label="Enable Jira">
              <input type="checkbox" name="jira_enabled" {% if jira.get('enabled') %}checked{% endif %} />
              <span class="toggle-slider"></span>
          </label>
          <span>Enabled</span>
      </div>
      <input type="hidden" name="jira_instance_count" value="{{ jira_instances|length }}" data-instance-count="jira" />
      <div class="space-y-2" data-instance-container="jira">{% for inst in jira_instances %}<div class="portal-settings-instance-card{% if not inst.get('enabled', True) %} is-instance-disabled{% endif %}" data-instance-item="jira"><input type="hidden" data-original-field="name" value="{{ inst.get('name','') }}" /><input type="hidden" data-original-field="url" value="{{ inst.get('url','') }}" /><div class="portal-settings-instance-head"><div class="portal-settings-instance-head-main"><span class="portal-settings-instance-title">Instance {{ loop.index }}</span><label class="toggle-switch"><input type="checkbox" data-field="enabled" value="1" aria-label="Enable Jira instance {{ loop.index }}" {% if inst.get('enabled', True) %}checked{% endif %} /><span class="toggle-slider"></span></label><span class="portal-instance-state" data-instance-state>{% if inst.get('enabled', True) %}Enabled{% else %}Disabled{% endif %}</span></div><button type="button" class="portal-instance-remove" data-action="remove-instance" data-group="jira">Remove</button></div><div class="portal-settings-instance-body"><div class="grid grid-cols-2 gap-2"><input type="text" data-field="name" value="{{ inst.get('name','') }}" placeholder="Name" class="portal-form-input" /><input type="text" data-field="url" value="{{ inst.get('url','') }}" placeholder="URL (e.g. https://yourcompany.atlassian.net)" class="portal-form-input" /></div><div class="grid grid-cols-2 gap-2"><input type="text" data-field="username" value="{{ inst.get('username','') }}" placeholder="Email" class="portal-form-input" /><input type="password" data-field="password" value="{{ inst.get('password','') }}" placeholder="Password" class="portal-form-input" /></div><div class="grid grid-cols-2 gap-2"><input type="password" data-field="token" value="{{ inst.get('token','') }}" placeholder="API token" class="portal-form-input" /><input type="text" data-field="project" value="{{ inst.get('project','') }}" placeholder="Project" class="portal-form-input" /></div><div class="grid grid-cols-2 gap-2"><select data-field="api_version" class="portal-form-select"><option value="" {% if not inst.get('api_version') %}selected{% endif %}>Auto API Version</option><option value="2" {% if inst.get('api_version') == '2' %}selected{% endif %}>REST API v2</option><option value="3" {% if inst.get('api_version') == '3' %}selected{% endif %}>REST API v3</option></select><div></div></div></div></div>{% endfor %}</div>
      <button type="button" class="portal-btn is-secondary" data-action="add-instance" data-group="jira">+ Add Jira Instance</button>
      <div class="flex items-center gap-2"><button type="button" class="portal-btn is-secondary" data-test-target="jira">Test Jira</button><div class="portal-inline-state" data-test-result="jira"></div></div>
    </section>
