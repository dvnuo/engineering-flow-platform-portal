{% extends "base.html" %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <h1>Engineering Portal</h1>
    <p class="portal-auth-copy">Sign in with an allowlisted account.</p>

    <form id="login-form" class="stack">
      <label>
        Username
        <input name="username" type="text" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required />
      </label>
      <label>
        Password
        <span class="portal-auth-password">
          <input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="portal-auth-reveal" data-toggle-password aria-pressed="false" aria-label="Show password">Show</button>
        </span>
      </label>
      <button type="submit">Sign In</button>
    </form>

    <p id="login-error" class="portal-auth-error" role="alert" aria-live="assertive"></p>

    <p class="portal-auth-footnote">
      Don't have an account? <a class="portal-auth-link" href="/register">Create one</a>
    </p>
  </div>
</div>

<script src="{{ static_url('js/auth_form.js') }}"></script>
<script>
initAuthForm({
  formId: "login-form",
  errorId: "login-error",
  endpoint: "/api/auth/login",
  pendingText: "Signing in…",
  submitText: "Sign In",
  fallbackError: "Sign-in failed. Please verify your username and password.",
  buildPayload: (data) => ({ username: data.username, password: data.password }),
});
</script>
{% endblock %}
