<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title }}</title>

    <script src="/static/lib/tailwind.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',

        theme: {
          extend: {
            colors: {
              brand: {
                500: '#3b82f6'
              }
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="/static/lib/typography.min.css" />
    <link rel="stylesheet" href="/static/css/app.css" />


    <script src="/static/lib/htmx.min.js"></script>
    <script src="/static/js/dialogs.js"></script>
    <script defer src="/static/lib/alpine.min.js"></script>
    <script src="/static/lib/markdown-it.min.js"></script>
    <script src="/static/lib/highlight.min.js"></script>
    <script src="/static/lib/lucide.min.js"></script>

    <script>
      // Runs before first paint so the resolved theme is already on <html>.
      // Preference is light | dark | system; anything else (including never
      // having chosen) means system, so a dark-mode OS gets a dark Portal.
      (function () {
        const saved = localStorage.getItem("portal-theme");
        const preference = ["light", "dark", "system"].indexOf(saved) >= 0 ? saved : "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const effective = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        document.documentElement.setAttribute("data-theme", effective);
        document.documentElement.setAttribute("data-theme-preference", preference);
        document.documentElement.classList.toggle("dark", effective === "dark");
      })();
    </script>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
