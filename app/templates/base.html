<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title }}</title>

    <script src="{{ static_url('lib/tailwind.min.js') }}"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',

        theme: {
          extend: {
            colors: {
              brand: {
                500: '#3b82f6'
              }
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="{{ static_url('lib/typography.min.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/app.css') }}" />


    <!-- htmx, highlight.js and lucide are ~570KB together and were all
         render-blocking, but nothing needs them while the document parses:
         chat_ui.js touches them only from inside functions, and deferred
         scripts run before DOMContentLoaded. markdown-it stays blocking
         because chat_ui.js constructs its renderer at top level, and
         chat_ui.js itself must stay non-deferred so chatApp() is defined
         before the deferred Alpine bootstraps. -->
    <script defer src="{{ static_url('lib/htmx.min.js') }}"></script>
    <script src="{{ static_url('js/dialogs.js') }}"></script>
    <script defer src="{{ static_url('js/tooltips.js') }}"></script>
    <script defer src="{{ static_url('lib/alpine.min.js') }}"></script>
    <script src="{{ static_url('lib/markdown-it.min.js') }}"></script>
    <script defer src="{{ static_url('lib/highlight.min.js') }}"></script>
    <script defer src="{{ static_url('lib/lucide.min.js') }}"></script>

    <script>
      // Runs before first paint so the resolved theme is already on <html>.
      // Preference is light | dark | system; anything else (including never
      // having chosen) means system, so a dark-mode OS gets a dark Portal.
      (function () {
        const saved = localStorage.getItem("portal-theme");
        const preference = ["light", "dark", "system"].indexOf(saved) >= 0 ? saved : "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const effective = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        document.documentElement.setAttribute("data-theme", effective);
        document.documentElement.setAttribute("data-theme-preference", preference);
        document.documentElement.classList.toggle("dark", effective === "dark");
      })();
    </script>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
