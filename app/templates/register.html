{% extends "base.html" %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <h1>Create Account</h1>
    <p class="portal-auth-copy">Your administrator must add your username to the allowlist before you register.</p>

    <form id="register-form" class="stack">
      <label>
        Username
        <input name="username" type="text" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required minlength="3" maxlength="32" />
      </label>
      <label>
        Password
        <span class="portal-auth-password">
          <input name="password" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="6" />
          <button type="button" class="portal-auth-reveal" data-toggle-password aria-pressed="false" aria-label="Show password">Show</button>
        </span>
        <small class="portal-auth-hint">At least 6 characters.</small>
      </label>
      <label>
        Confirm Password
        <input name="confirm_password" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="6" />
      </label>
      <button type="submit">Create Account</button>
    </form>

    <p id="register-error" class="portal-auth-error" role="alert" aria-live="assertive"></p>

    <p class="portal-auth-footnote">
      Already have an account? <a class="portal-auth-link" href="/login">Sign in</a>
    </p>
  </div>
</div>

<script src="/static/js/auth_form.js"></script>
<script>
initAuthForm({
  formId: "register-form",
  errorId: "register-error",
  endpoint: "/api/auth/register",
  pendingText: "Creating account…",
  submitText: "Create Account",
  fallbackError: "Registration failed. Please try a different username.",
  validate: (data) => (data.password !== data.confirm_password ? "Passwords do not match." : null),
  buildPayload: (data) => ({ username: data.username, password: data.password }),
});
</script>
{% endblock %}
