apiVersion: v1
kind: Secret
metadata:
  name: efp-portal-secret
  namespace: default
stringData:
  # A long random value, kept stable across restarts, for example the output of
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  # The Portal does not start while this is empty.
  SECRET_KEY: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""
  GIT_TOKEN: ""
