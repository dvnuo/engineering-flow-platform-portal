# ServiceAccount for portal
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: default
---
# Role for portal to manage efp-agents in efp-agents namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-agent-manager
  namespace: efp-agents
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read-only: live CPU and memory of an assistant's pod for the details panel.
# Needs metrics-server in the cluster; without this rule (or without
# metrics-server) the panel shows limits and restart reasons but no usage.
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# RoleBinding for portal
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-agent-binding
  namespace: efp-agents
subjects:
- kind: ServiceAccount
  name: portal
  namespace: default
roleRef:
  kind: Role
  name: portal-agent-manager
  apiGroup: rbac.authorization.k8s.io
