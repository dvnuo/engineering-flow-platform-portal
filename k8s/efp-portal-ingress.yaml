apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: efp-portal-ingress
  namespace: default
  labels:
    app: efp-portal-ingress
  annotations:
    # Chat SSE streams and event WebSockets stay open for the duration of
    # long agent runs. The ingress-nginx defaults (60s proxy read/send
    # timeouts) would kill them during quiet stretches; runtimes also send
    # SSE keepalives every 15s as the primary protection.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Upload size ceiling for browser -> Portal. Without this, ingress-nginx
    # defaults to 1MB and caps every upload there. Kept a little above the
    # app's EFP_MAX_UPLOAD_MB (25MB) so oversized uploads get the Portal's
    # clear 413 ("Maximum size is 25MB") instead of nginx's generic one.
    # Raise both together when increasing the limit. Do not go below 30m
    # while Apps are on: an app's image call through this address
    # (/api/app-sdk/v1/images/inspect, four images of 5 MiB) is about 28 MB
    # of JSON.
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  rules:
    # The Portal answers on its own host name only; replace the placeholder
    # with the host in BASE_URI. Without a host the rule would also catch
    # every other name that resolves to this ingress controller, a sibling
    # subdomain that serves member apps included.
    # /api/internal/ and /api/app-host/ are for callers inside the cluster:
    # the Portal answers 404 to any request for them that arrives through
    # this ingress (INTERNAL_API_BLOCK_FORWARDED, see k8s/README.md).
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: efp-portal-service
                port:
                  number: 80