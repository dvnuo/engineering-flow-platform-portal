name: Portal CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  portal-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      K8S_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check app/static/js/chat_ui.js
      - run: node --check app/static/js/composer_skill_chip.js
      # Runs the whole suite. CI used to name 25 of the repo's 145 test files,
      # so anything outside that list could rot unnoticed: four files had been
      # failing on master for several PRs before anyone ran pytest locally.
      - run: pytest tests/

  portal-docker-smoke:
    runs-on: ubuntu-latest
    needs: portal-tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t efp-portal-ci .
